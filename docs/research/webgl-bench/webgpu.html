<!doctype html><html><head><meta charset="utf-8"><title>webgpu bench</title></head><body><pre id="log"></pre>
<script type="module">
import * as THREE from '/node_modules/three/build/three.webgpu.js'
import { Output, Mp4OutputFormat, BufferTarget, CanvasSource } from '/node_modules/mediabunny/dist/bundles/mediabunny.mjs'
const W = 1080, H = 1920, FPS = 30, DUR = 15
try {
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H
  const renderer = new THREE.WebGPURenderer({ canvas, antialias: true })
  renderer.setPixelRatio(1); renderer.setSize(W, H, false)
  await renderer.init()
  const backend = renderer.backend.isWebGPUBackend ? 'webgpu' : 'webgl2-fallback'
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#202020')
  const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100); camera.position.z = 8
  const meshes = []
  for (let i = 0; i < 20; i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshNormalMaterial())
    m.position.set((i % 4) - 1.5, Math.floor(i / 4) - 2, 0); scene.add(m); meshes.push(m)
  }
  const output = new Output({ format: new Mp4OutputFormat({ fastStart: 'in-memory' }), target: new BufferTarget() })
  const source = new CanvasSource(canvas, { codec: 'avc', bitrate: 16e6, keyFrameInterval: 1 })
  output.addVideoTrack(source, { frameRate: FPS }); await output.start()
  const n = DUR * FPS, t0 = performance.now()
  for (let i = 0; i < n; i++) {
    const t = i / FPS
    meshes.forEach((m, k) => { m.rotation.x = t + k * 0.1; m.rotation.y = t * 0.7 })
    renderer.render(scene, camera)
    await source.add(t, 1 / FPS)
  }
  await output.finalize()
  const total = performance.now() - t0
  await fetch('/save?name=webgpu.mp4', { method: 'POST', body: output.target.buffer })
  window.__result = { backend, fps: +(n / (total / 1000)).toFixed(1), totalMs: Math.round(total) }
} catch (e) { window.__result = { error: String(e.stack || e) } }
</script></body></html>
